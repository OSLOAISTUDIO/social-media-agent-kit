[research]
# Tema-macro: o foco de toda a pesquisa. Perguntado no setup (./scripts/new_brand.sh).
subject = "__TEMA__"
short = "__TEMA__"                       # versão curta, usada nas mensagens do bot
# Consultas de sinais (Hacker News e Google News). Vazias = usa o tema-macro.
# O tema-macro entra primeiro; as consultas de marketing e vendas abaixo são um ponto de partida:
# troque pelas do seu setor.
hn_queries = ["__TEMA_EN__", "marketing", "growth", "SaaS", "sales", "advertising", "SEO", "B2B"]
news_br = ["__TEMA__", "marketing digital tendências", "vendas B2B", "Meta anúncios novidade"]
news_us = ["__TEMA_EN__", "marketing trends", "B2B sales", "SaaS growth"]

# ----- Opcionais da pesquisa (sem eles: últimos 7 dias, foco em potencial viral e novidade) -----
# priorities: o que priorizar dentro do tema (ex.: novidades, aplicações práticas, dados).
# priorities = """PRIORIDADE: 1. ... 2. ... 3. ..."""
# scope: substitui a abertura do prompt de pesquisa (ex.: janela maior, olhar mais macro).
# scope = """Pesquise na web os movimentos dos últimos 3 meses em <tema>, com dados e pesquisas recentes."""
# mix: regra de distribuição dos tipos de tema (Novidade, Aplicação prática, Tendência, Dados e pesquisa, Mercado).
# mix = "Pelo menos metade dos temas do tipo Tendência ou Dados e pesquisa."
# news_days: janela do Google News e do Hacker News, em dias (padrão 7).
# news_days = 30
# weights: pesos do ranking dos temas; só os informados mudam (padrão: momentum 0.40, novelty 0.25,
# relevance 0.20, ownability 0.15). Para algo menos "hype" e mais macro, reduza momentum/novelty.
# weights = { momentum = 0.25, novelty = 0.15, relevance = 0.35, ownability = 0.25 }

[content]
# ----- Opcionais de texto (prevalecem sobre as regras genéricas e entram na revisão editorial) -----
# arcs: roteiros narrativos do carrossel (sequência de slides por tipo de tema).
# arcs = """- Arco para NOVIDADE: o que é (capa) → por que importa → como funciona (ilustração) → ... → CTA."""
# illustration_hint: como descrever o estilo das ilustrações para quem escreve o post.
# illustration_hint = """no padrão visual da marca: isométrica, blocos na cor de acento, rótulos numerados."""
# copy: regras de copy dos slides da marca.
# copy = """- Capa em forma de pergunta que o público faria.
# - Nome da marca só no último slide."""
# captions: regras de legenda da marca.
# captions = """- Legenda sem tom de anúncio: começa pelo insight, não pela oferta.
# - Sem hashtags no LinkedIn."""

[visual]
# Cores da marca em #RRGGBB. PENDENTE: substituir pela identidade visual da empresa.
paper = "#F7F6F3"
ink = "#121212"
accent = "#1C1C1C"
surface = "#ECEAE5"
overlay = "12,12,12"
font_family = "Inter"                  # nome da família; troque pelo da fonte da marca
font_regular = ""                      # ex.: "fonts/MinhaFonte-Regular.otf" (vazio = usa Inter/sistema)
font_medium = ""                       # ex.: "fonts/MinhaFonte-Medium.otf"
logo_light = "logo/logo-light.svg"
logo_dark = "logo/logo-dark.svg"
# ----- Opcionais visuais -----
# font_display / font_display_file: segunda fonte, só para títulos e números (display);
# o texto corrido continua em font_family.
# font_display = "Minha Display"
# font_display_file = "fonts/MinhaDisplay-Regular.otf"
# cover_photo: false = capa só com texto, no fundo da marca (a foto continua no CTA).
# cover_photo = false
# slide_counter: false = sem "01 / 09" no topo e sem barra de progresso (mostra o site no rodapé).
# slide_counter = false
photo_mood = "PENDENTE"

[illustration]
reference = "style/illustration-reference.png"   # opcional; se não existir, gera só pelo texto
style = '''PENDENTE (ver o exemplo em brands/exemplo)'''

[language]
# Checagens automáticas do texto (opcional): travessao | exclamacao | paralelismo | dicotomia
checks = []
# Palavras e expressões que a marca não usa (opcional)
banned = []
brand_regex = ''   # opcional: regex de grafia errada do nome
brand_regex_msg = ""

[knowledge]
root = "knowledge"
core = ["marca.md"]
skip_dirs = []
files_description = "posicionamento, soluções e metodologia da marca"
