# Pacote de marca de EXEMPLO: Atlas (empresa fictícia).
# Serve para testar o kit logo depois de baixar (BRAND=exemplo) e como referência de preenchimento.
# Para a sua empresa: ./scripts/new_brand.sh <slug> "<Nome>" e preencha o pacote novo.

[identity]
name = "Atlas"
category = "consultoria de gestão e inteligência artificial"
city = "São Paulo, Brasil"
site = "atlas.exemplo.com"
instagram = "@atlas.exemplo"
kicker = "Insights"
footer_tagline = "Consultoria de gestão e IA"
cta_button = "Fale com a Atlas no link da bio →"
editorial_standard = "dados verificáveis, linguagem simples e foco no que muda na operação"

[voice]
language_label = "tom de voz da Atlas"
audience = '''donos de empresa, gestores e diretores no Brasil. Eles rolam o feed rápido: o post precisa
parar o dedo no primeiro slide e entregar valor claro em poucos segundos.'''
tone = '''viral sem ser vulgar ou apelativo.
- Fale com o leitor ("você", "sua empresa"), em linguagem simples, como uma conversa inteligente.
- Mostre o benefício concreto (tempo, dinheiro, resultado) antes de explicar como funciona.
- Use curiosidade, contraste e números para criar gancho, sempre com verdade.
- Corte jargão técnico; se precisar de um termo, explique em poucas palavras.
- Nada de clickbait mentiroso, promessa falsa, sensacionalismo, caixa alta para gritar ou emoji.'''
cover_example = "Novo recurso do ChatGPT: um assistente que organiza a semana do seu time sozinho."
style_rules = "Sem travessão (—), sem exclamação, sem emojis nas peças, sem adjetivos inflados."
rules = [
  'Nome da marca sempre "Atlas".',
  "Nunca cite cliente, contrato, valor ou métrica interna que não seja pública.",
]

[[pillars]]
name = "Diagnóstico"
desc = "Onde a operação perde tempo e dinheiro hoje."
[[pillars]]
name = "Implementação"
desc = "Processos e ferramentas de IA funcionando no dia a dia."
[[pillars]]
name = "Treinamento"
desc = "Equipes preparadas para usar IA com critério."

[research]
subject = "IA, tecnologia e gestão"
priorities = '''PRIORIDADE (nesta ordem):
1. NOVIDADES: lançamentos e recursos novos de ferramentas que as empresas já podem usar
   (IA generativa, automação, produtividade, gestão).
2. APLICAÇÃO PRÁTICA: como usar a novidade no dia a dia de uma empresa, com exemplos concretos
   por área (comercial, operações, atendimento, financeiro, RH).
3. Dados, pesquisas e movimentos de mercado: entram como contexto ou tema quando forem fortes.

Para novidades, a fonte primária é o anúncio oficial (blog, changelog, central de ajuda), com data.
Inclua fontes brasileiras quando houver.'''
hn_queries = ["AI", "LLM", "ChatGPT", "automation", "productivity", "launch"]
news_br = ["inteligência artificial empresas", "ChatGPT novo recurso", "gestão produtividade"]
news_us = ["AI new feature", "AI launch", "productivity tools"]

[content]
arcs = '''- Arco para NOVIDADE / APLICAÇÃO PRÁTICA: o que foi lançado (capa) → o que é e por que importa →
  como funciona (ilustração) → aplicações práticas no dia a dia, com exemplos por área (list) →
  limites e cuidados → o que muda para empresas → CTA.
- Arco para DADOS / MERCADO: abertura (o fato) → contexto com dados → ilustração → o que muda
  para empresas → o que fazer → CTA.
- Aplicações práticas são específicas e acionáveis, nunca genéricas ("aumentar a produtividade").'''
illustration_hint = '''no padrão visual da Atlas: isométrica, planos empilhados com profundidade
  sutil, blocos na cor de acento com ícones brancos, rótulos numerados com linhas-guia.'''

[visual]
paper = "#FAFAF7"
ink = "#14161A"
accent = "#2F5D50"
surface = "#EEEEE8"
overlay = "14,22,20"
font_family = "Inter"
font_regular = ""
font_medium = ""
logo_light = "logo/logo-light.svg"
logo_dark = "logo/logo-dark.svg"
photo_mood = "fotografia editorial de paisagem natural, luz suave, sem pessoas"

[illustration]
reference = "style/illustration-reference.png"
style = '''Premium editorial isometric illustration for a management and AI consultancy.
- Isometric exploded view: thin flat planes/cards stacked or arranged in depth, each with a subtle
  light grey-green side edge to show thickness, and a very soft, diffuse shadow beneath.
- Line work: precise 1.5-2px strokes in deep green (#2F5D50) on off-white surfaces (#F7F7F4).
- Accent: solid deep green (#2F5D50) blocks/tiles, some with simple white line icons inside
  (search, mail, document, people, chart, calendar, gear: minimal, consistent stroke).
- Data details: small bar charts in graded green tones, thin text lines suggesting documents,
  one big metric if it helps the story.
- Numbered side labels with thin leader lines to each layer/element, small wide-tracked uppercase
  sans-serif in muted grey-green (#5F7570), formatted like "01 · DADOS".
- Background: solid flat white edge to edge, no texture, no vignette, generous empty margin
  (at least 7% on every side). Composition centred, balanced, nothing cropped.
Strictly NO: people, faces, robots, brains, circuit boards, glowing effects, neon, gradients in the
background, photo-realism, cartoon style, emojis, logos, watermarks, titles or captions, and no text
other than the exact labels listed.'''

[language]
checks = ["travessao", "exclamacao", "paralelismo", "dicotomia"]
banned = ["revolucionári", "disruptiv", "mágic", "incrível", "game changer"]
brand_regex = ''
brand_regex_msg = ""

[knowledge]
root = "knowledge"
core = ["marca.md"]
skip_dirs = []
files_description = "posicionamento, soluções e metodologia da Atlas"
